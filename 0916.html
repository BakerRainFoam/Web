<html>
<head>
<style>
table, th, td {
  border: 1px solid white;
  border-collapse: collapse;
}
th, td {
  background-color: #1900ff48;
}
</style>
</head>
<body>

<h2>資訊三甲 黃涒幃</h2>

<p>
    <script>
    for (let i = 0; i <= 9; i++) {
        for (let j = 0; j <= i ; j++) {
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
        }
        document.write("<br>");
    }
    </script>
    <script>
    document.write("<table align='center'>");
    for (let i = 0; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 0; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>
<style>
    td {
         border: 1px solid;
    }
</style>
